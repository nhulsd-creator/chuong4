<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ôn tập Chương 4 Tư tưởng Hồ Chí Minh: Đảng Cộng sản Việt Nam và Nhà nước của nhân dân, do nhân dân, vì nhân dân. Biên soạn: TS. Bùi Văn Như">
<meta name="author" content="TS. Bùi Văn Như">
<title>Người Cầm Lái Vững</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,600;0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F7F3FC; --surface:#FFFFFF; --surface2:#EFE7F8; --ink:#231438; --muted:#6B5A83; --line:#E0D3EF;
  --violet:#5B2A9E; --magenta:#C13584; --coral:#F26B4F; --amber:#F5A623; --teal:#0F9D8F;
  --ok:#128A5A; --ok-soft:#DDF5EA; --bad:#C7362B; --bad-soft:#FCE3E0;
  --grad:linear-gradient(120deg,#3A1670 0%,#7A2A9C 38%,#C13584 68%,#F26B4F 100%);
  --serif:"Noto Serif Display","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120B1C; --surface:#1C1329; --surface2:#271B38; --ink:#F3ECFB; --muted:#B7A6CE; --line:#382A4D;
  --violet:#B18AF0; --magenta:#F07AB8; --coral:#FF9A82; --amber:#FFC45C; --teal:#4FD1C1;
  --ok:#5FD79E; --ok-soft:#15301F; --bad:#FF8A7E; --bad-soft:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120B1C; --surface:#1C1329; --surface2:#271B38; --ink:#F3ECFB; --muted:#B7A6CE; --line:#382A4D;
  --violet:#B18AF0; --magenta:#F07AB8; --coral:#FF9A82; --amber:#FFC45C; --teal:#4FD1C1;
  --ok:#5FD79E; --ok-soft:#15301F; --bad:#FF8A7E; --bad-soft:#3A1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 56px;margin:0}
.wrap{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* HERO */
.hero{margin-top:20px;position:relative;overflow:hidden;border-radius:22px;background:var(--grad);color:#FFF7EE;padding:26px 26px 22px;box-shadow:0 26px 50px -28px rgba(90,20,110,.75)}
.hero::before{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55),transparent 65%)}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;opacity:.85}
.chap{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;background:#FFD27A;color:#3A1670;padding:4px 14px;border-radius:999px}
.title{margin:18px 0 6px;text-align:center;font-family:var(--serif);font-weight:700;text-transform:uppercase;line-height:1.2;display:grid;justify-items:center;gap:.06em;font-size:clamp(21px,3.6vw,38px)}
.title .k{font-family:var(--sans);font-weight:700;font-size:.42em;letter-spacing:.3em;opacity:.9;display:flex;align-items:center;gap:.8em;margin-bottom:.3em}
.title .k::before,.title .k::after{content:"";width:2.2em;height:1px;background:currentColor;opacity:.7}
.title .l{display:block}
.title .l.accent{color:#FFD27A}
.quote{margin:16px auto 4px;max-width:700px;text-align:center;border-block:1px solid rgba(255,255,255,.25);padding-block:12px 8px}
.quote .ic{display:block;margin:0 auto 4px;width:44px;height:32px;color:#FFD27A}
.quote blockquote{margin:0;font-family:var(--serif);font-size:clamp(15px,2.1vw,21px);line-height:1.4}
.quote blockquote i{color:#FFE2A8}
.quote figcaption{margin-top:6px;text-align:right;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;font-weight:700}
.quote figcaption::before{content:"— "}
.author{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 30px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2);text-align:center;font-size:14px}
.author div{display:grid}
.author span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;font-weight:700}
.author b{font-weight:600}

/* JOURNEY MAP */
.journey{margin-top:26px;display:grid;gap:12px}
.journey-head{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.journey-head h2{margin:0;font-family:var(--serif);font-size:24px}
.stars-total{font-weight:700;color:var(--muted);font-size:14px}
.stars-total b{color:var(--magenta);font-size:18px}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;counter-reset:st}
.station{position:relative;display:grid;gap:6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px 12px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.station:hover{transform:translateY(-3px);box-shadow:0 14px 26px -18px rgba(90,20,110,.6);border-color:var(--c)}
.station[aria-current="true"]{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.station .top{display:flex;align-items:center;gap:10px}
.station .dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--c);flex:0 0 auto;font-size:15px}
.station .nm{font-weight:700;line-height:1.25}
.station .ds{font-size:13px;color:var(--muted);line-height:1.4}
.station .st{font-size:13px;letter-spacing:.1em;color:var(--amber)}
.station .st i{color:var(--line);font-style:normal}

/* BAR */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-top:22px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line)}
.bar .back{border:0;background:var(--surface2);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;flex:0 0 auto}
.bar .cur{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .cur span{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c,var(--violet));margin-right:8px}
.fsbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--amber);color:#2A1500}
.fsbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:560px){.fsbtn span{display:none}.fsbtn{padding:8px 10px}}

/* PANEL common */
.panel{margin-top:18px;display:grid;gap:16px}
.panel>h2{margin:0;font-family:var(--serif);font-size:clamp(22px,3vw,30px);color:var(--c,var(--ink))}
.lead{margin:0;color:var(--muted);max-width:68ch}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;box-shadow:0 12px 30px -26px rgba(60,20,90,.6)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-weight:700}
.lv{padding:2px 9px;border-radius:999px;font-weight:800;letter-spacing:.03em}
.lv-NB{background:#E4ECFF;color:#2F4FB5}.lv-TH{background:#FFF0D2;color:#9A5B00}.lv-VD{background:#DDF5EA;color:#0F7A4E}.lv-VDC{background:#FDE0EC;color:#A3195B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv-NB{background:#1E2848;color:#9DB4FF}:root:not([data-theme="light"]) .lv-TH{background:#3A2A10;color:#FFC45C}:root:not([data-theme="light"]) .lv-VD{background:#12301F;color:#6FDDA6}:root:not([data-theme="light"]) .lv-VDC{background:#3A1328;color:#F58CC0}}
.qtext{margin:0;font-size:18px;font-weight:600;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--c,var(--violet))}
.opt .kk{font-weight:800;min-width:20px;color:var(--c,var(--violet))}
.opt.sel{border-color:var(--c,var(--violet));background:var(--surface2)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.exp{border-left:4px solid var(--amber);background:var(--surface2);padding:10px 13px;border-radius:0 10px 10px 0;font-size:15px}
.exp strong{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--c,var(--violet));border-color:var(--c,var(--violet));color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);transition:width .3s}
.result{border-radius:18px;padding:22px;color:#FFF7EE;background:var(--grad);display:grid;gap:6px}
.result .big{font-family:var(--serif);font-size:56px;line-height:1;font-weight:700}
.result .big span{color:#FFD27A;font-size:.6em}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.chip b{color:var(--c,var(--magenta))}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* SUMMARY */
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys span{font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pillar-head{display:flex;gap:14px;align-items:center;padding:14px 18px;color:#fff;background:var(--tc)}
.pillar-head .n{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1}
.pillar-head h3{margin:0;font-size:18px;line-height:1.3}
.pillar-body{padding:16px 18px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px 28px}
.pillar-body h4{margin:0 0 6px;color:var(--tc);font-size:15px}
.pillar-body ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px}
.pillar-body li::marker{color:var(--tc)}
.tone-violet{--tc:#5B2A9E}.tone-coral{--tc:#D8503A}.tone-amber{--tc:#B8720A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tone-violet{--tc:#8E5FD6}:root:not([data-theme="light"]) .tone-coral{--tc:#E0705A}:root:not([data-theme="light"]) .tone-amber{--tc:#D4952A}}

/* FLASHCARDS */
.flash-wrap{perspective:1400px}
.flash{position:relative;width:100%;min-height:280px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.flash.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;padding:26px;display:grid;place-content:center;gap:12px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:var(--grad);color:#fff}
.face.front .q{font-family:var(--serif);font-size:clamp(20px,3vw,28px);font-weight:700;line-height:1.3}
.face.front .hint{font-size:13px;opacity:.85;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.face.back{background:var(--surface);border:2px solid var(--magenta);transform:rotateY(180deg);color:var(--ink)}
.face.back .a{font-size:17px;line-height:1.55;text-align:left}
.face.back .m{justify-self:center;background:#FFF0D2;color:#7A4700;font-weight:800;border-radius:999px;padding:6px 14px;font-size:14px}
.pillar-body li b{font-weight:800;color:var(--tc);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--tc) 16%,transparent) 62%);padding:0 2px}
@media (prefers-reduced-motion: reduce){.flash{transition:none}}
.deck-info{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}

/* MATCH */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mcol h4{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font-weight:600;font-size:15px;line-height:1.35;transition:transform .12s}
.tile.q{font-family:var(--serif);font-style:italic}
.tile.sel{border-color:var(--c);background:var(--surface2);transform:scale(1.02)}
.tile.done{border-color:var(--ok);background:var(--ok-soft);cursor:default;opacity:.8}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* LIST RECALL */
.slots{display:grid;gap:8px;counter-reset:s}
.slot{display:flex;gap:10px;align-items:center;min-height:46px;border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.slot::before{counter-increment:s;content:counter(s);font-weight:800;color:var(--c);width:22px}
.slot.fill{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .tile{font-size:14px}
.pool .tile.bad{border-color:var(--bad);background:var(--bad-soft);opacity:.6;cursor:default;text-decoration:line-through}

/* SORT 3 bins */
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bins .opt{justify-content:center;text-align:center;font-weight:800;min-height:64px;align-items:center;font-size:15px}
.bins .opt:nth-child(1){--bc:#5B2A9E}.bins .opt:nth-child(2){--bc:#C13584}.bins .opt:nth-child(3){--bc:#E0602F}
.bins .opt:not(.right):not(.wrong){border-color:var(--bc);color:var(--bc)}
@media (max-width:520px){.bins{grid-template-columns:1fr}}
.card-q{font-family:var(--serif);font-size:21px;font-weight:700;text-align:center;line-height:1.4;padding:8px 4px;margin:0}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--magenta);color:var(--magenta);text-align:center;font-weight:800;padding:0 4px}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfbtns .opt{justify-content:center;font-weight:800;font-size:18px}

/* review / cases */
.review{display:grid;gap:10px}
.review .item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px}
.review .a{color:var(--ok);font-weight:700}.review .y{color:var(--bad)}
.case{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px}
.case .tag{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--magenta)}
.case h3{margin:0}
.case ol,.case ul{margin:0;padding-left:22px;display:grid;gap:4px}
details summary{cursor:pointer;font-weight:700;color:var(--magenta)}
.timer{font-family:var(--serif);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.navnum{display:flex;flex-wrap:wrap;gap:6px}
.navnum button{width:34px;padding:4px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}
.navnum button.on{background:var(--ink);color:var(--bg)}.navnum button.ans{background:var(--surface2)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

/* focus / fullscreen mode */
body.focus .hero,body.focus .journey,body.focus footer{display:none}
body.focus .wrap{max-width:1120px}
body.focus .qtext,body.focus .card-q{font-size:clamp(20px,2.5vw,30px)}
body.focus .opt{font-size:clamp(16px,1.7vw,21px);padding:14px 16px}
body.focus .face.back .a{font-size:clamp(17px,1.9vw,23px)}
.nw{display:inline-block}
@media (max-width:640px){.stations{grid-template-columns:1fr 1fr;gap:8px}.station{padding:10px}.station .ds{display:none}.station .dot{width:30px;height:30px;font-size:13px}.station .nm{font-size:14px}.station .top{gap:8px}.match{grid-template-columns:1fr}.hero{padding:20px 16px 16px}.title .l{text-wrap:balance}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>


</head>

#lockGate .gcard{width:min(440px,100%);background:#fff;border:1px solid #E3E3EA;border-radius:18px;padding:28px 24px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);display:grid;gap:14px;text-align:center}
#lockGate .gic{width:58px;height:58px;margin:0 auto;border-radius:16px;display:grid;place-items:center;background:var(--gacc);color:#fff}
#lockGate .gch{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--gacc)}
#lockGate h1{margin:0;font-size:20px;line-height:1.3}
#lockGate .gsub{margin:0;font-size:14px;color:#5A5A6A}
#lockGate form{display:grid;gap:10px;margin:0}
#lockGate input{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid #D0D0DA;text-align:center;letter-spacing:.04em}
#lockGate input:focus{outline:3px solid color-mix(in srgb,var(--gacc) 45%,transparent);border-color:var(--gacc)}
#lockGate button{font:inherit;font-weight:800;font-size:16px;padding:12px;border:0;border-radius:12px;background:var(--gacc);color:#fff;cursor:pointer}
#lockGate button[disabled]{opacity:.6;cursor:wait}
#lockGate .gerr{min-height:20px;margin:0;font-size:14px;font-weight:700;color:#C0392B}
#lockGate .gnote{font-size:12.5px;color:#6A6A7A;margin:0}
#lockGate label.gk{display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;color:inherit}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=p=>p.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]/g,"");
async function open(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(pw)),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
 return new TextDecoder().decode(pt);
}
function mount(html){

 app.querySelectorAll("script").forEach(old=>{const s=document.createElement("script");s.textContent=old.textContent;old.replaceWith(s);});
 document.getElementById("lockGate").remove();
}
